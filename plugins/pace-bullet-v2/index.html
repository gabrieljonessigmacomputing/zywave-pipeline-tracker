<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Goal pace bar</title>
<!-- SDK UMD needs window.React at load and exports window.SigmaPlugin -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:transparent;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#0f172a;-webkit-font-smoothing:antialiased}
  #root{box-sizing:border-box;width:100%;height:100%;padding:14px 18px;
    display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
  .title{font-size:13px;font-weight:500;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .value{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:#0f172a}
  .pct{font-size:14px;font-weight:600;color:var(--fill,#f97316)}
  .track{position:relative;height:8px;border-radius:999px;background:#e2e8f0;margin:10px 0 6px}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--fill,#f97316);
    transition:width .35s ease}
  .tick{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;border-radius:1px;
    background:var(--tick,#334155);transition:left .35s ease}
  .foot{font-size:12px;color:#64748b}
  .foot b{font-weight:600;color:#334155}
  .wait{font-size:13px;color:#64748b}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";
  var root = document.getElementById("root");

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function num(v) { var n = Number(v); return isFinite(n) ? n : null; }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function toFrac(v) {
    v = num(v);
    if (v === null) return null;
    return Math.abs(v) <= 1 ? v : v / 100;
  }
  function sig(v, p) {
    if (v === 0) return "0";
    var units = [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]];
    var a = Math.abs(v);
    for (var i = 0; i < units.length; i++) {
      if (a >= units[i][0]) {
        var s = v / units[i][0];
        return (Math.abs(s) >= Math.pow(10, p) ? String(Math.round(s)) : s.toPrecision(p)) + units[i][1];
      }
    }
    return a >= Math.pow(10, p) ? String(Math.round(v)) : Number(v.toPrecision(p)).toString();
  }
  function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function fmt(v, hint) {
    v = num(v); if (v === null) return "—";
    var m = /^\s*(\$)?(,)?\.?(\d)?([sf])\s*$/.exec(hint || "") || /^\s*(\$)?(,)?\.(\d)([sf])\s*$/.exec("$,.2s");
    var dollar = m[1] ? "$" : "", comma = !!m[2], p = m[3] === undefined ? 2 : +m[3], kind = m[4];
    var body;
    if (kind === "s") body = sig(v, Math.max(1, p));
    else {
      body = Math.abs(v).toFixed(p);
      if (comma) { var parts = body.split("."); parts[0] = group(parts[0]); body = parts.join("."); }
      if (v < 0) body = "-" + body;
    }
    return body.charAt(0) === "-" ? "-" + dollar + body.slice(1) : dollar + body;
  }
  function colorOk(c) { return typeof c === "string" && /^#?[0-9a-fA-F]{3,8}$|^[a-z]+$|^rgba?\(/.test(c.trim()); }
  function normColor(c, d) {
    if (!colorOk(c)) return d; c = c.trim();
    return /^[0-9a-fA-F]{3,8}$/.test(c) ? "#" + c : c;
  }
  function sourceId(src) {
    if (!src) return null;
    if (typeof src === "string") return src;
    if (typeof src === "object") return src.elementId || src.id || src.nodeId || null;
    return null;
  }
  function colKey(cfgVal) {
    if (cfgVal == null || cfgVal === "") return null;
    if (typeof cfgVal === "string" || typeof cfgVal === "number") return String(cfgVal);
    if (Object.prototype.toString.call(cfgVal) === "[object Array]") return colKey(cfgVal[0]);
    if (typeof cfgVal === "object") {
      if (cfgVal.columnId != null) return String(cfgVal.columnId);
      if (cfgVal.id != null) return String(cfgVal.id);
    }
    return null;
  }

  function draw(d) {
    var actual = num(d.actual), goal = num(d.goal);
    var pct = (actual !== null && goal) ? actual / goal : 0;
    var barPct = clamp01(pct);
    var paced = d.paced === null || d.paced === undefined ? null : clamp01(d.paced);
    var fillC = normColor(d.fillColor, "#f97316"), tickC = normColor(d.tickColor, "#334155");
    var through = paced !== null ? Math.round(paced * 100) + "% through period" : "";

    var h = "";
    if (d.title) h += '<div class="title">' + esc(d.title) + '</div>';
    if (through) h += '<div class="foot" style="margin:0 0 2px">' + esc(through) + '</div>';
    h += '<div class="row"><span class="value">' + esc(fmt(actual, d.valueFormat)) + '</span>' +
         '<span class="pct">' + (pct * 100).toFixed(1) + '% of goal</span></div>';
    h += '<div class="track"><div class="fill" style="width:' + (barPct * 100).toFixed(2) + '%"></div>';
    if (paced !== null) h += '<div class="tick" style="left:' + (paced * 100).toFixed(2) + '%"></div>';
    h += '</div>';
    h += '<div class="foot">Target: <b>' + esc(fmt(goal, d.valueFormat)) + '</b>' +
         (paced !== null ? ' · <b>' + Math.round(paced * 100) + '%</b> paced' : '') + '</div>';
    root.style.setProperty("--fill", fillC);
    root.style.setProperty("--tick", tickC);
    root.innerHTML = h;
  }

  function waiting(msg) {
    root.innerHTML = '<div class="wait">' + esc(msg || "Waiting for workbook data…") + '</div>';
  }

  function synth() {
    return { title: "Year Pipeline Created", actual: 1840000, goal: 3000000, paced: 0.72,
             valueFormat: "$,.2s", fillColor: null, tickColor: null };
  }

  function getClient() {
    return (window.SigmaPlugin && window.SigmaPlugin.client)
      || (window.sigma && window.sigma.plugin && window.sigma.plugin.client)
      || (window.sigmaComputing && window.sigmaComputing.plugin && window.sigmaComputing.plugin.client)
      || null;
  }

  var LAST = null, CFG = null, DATA = null, unsub = null;

  function render() {
    if (!CFG || !sourceId(CFG.source)) {
      if (!LAST) draw(synth());
      else draw(LAST);
      return;
    }
    var aKey = colKey(CFG.actual), gKey = colKey(CFG.goal);
    if (!DATA || !aKey || !gKey || !DATA[aKey] || !DATA[gKey] || !DATA[aKey].length) {
      waiting(CFG.title ? CFG.title + " · loading…" : "Waiting for workbook data…");
      return;
    }
    function first(key) {
      var col = colKey(CFG[key]);
      if (!col || !DATA[col] || !DATA[col].length) return null;
      return DATA[col][0];
    }
    var paced = toFrac(first("pacedPct"));
    if (paced === null) paced = toFrac(first("elapsedPct"));
    LAST = { title: CFG.title, actual: num(first("actual")), goal: num(first("goal")), paced: paced,
             valueFormat: CFG.valueFormat || "$,.2s", fillColor: CFG.fillColor, tickColor: CFG.tickColor };
    draw(LAST);
  }

  function wire(client) {
    client.config.configureEditorPanel([
      { name: "source", type: "element" },
      { name: "actual", type: "column", source: "source", allowedTypes: ["number"], label: "Actual (number)" },
      { name: "goal", type: "column", source: "source", allowedTypes: ["number"], label: "Goal (number)" },
      { name: "pacedPct", type: "column", source: "source", allowedTypes: ["number"], label: "Paced % (0-1 or 0-100)" },
      { name: "elapsedPct", type: "column", source: "source", allowedTypes: ["number"], label: "Elapsed % (optional)" },
      { name: "title", type: "text", label: "Title (optional)", placeholder: "e.g. Year Pipeline Created" },
      { name: "valueFormat", type: "text", label: "Value format hint", placeholder: "$,.2s", defaultValue: "$,.2s" },
      { name: "fillColor", type: "text", label: "Fill color (optional)", placeholder: "#f97316" },
      { name: "tickColor", type: "text", label: "Tick color (optional)", placeholder: "#334155" }
    ]);
    client.config.subscribe(function (cfg) {
      if (unsub) { unsub(); unsub = null; }
      CFG = cfg || null; DATA = null;
      var sid = CFG && sourceId(CFG.source);
      if (!sid) { render(); return; }
      unsub = client.elements.subscribeToElementData(CFG.source, function (data) {
        DATA = data || null; render();
      });
      render();
    });
  }

  var tries = 0;
  (function boot() {
    var client = getClient();
    if (client) { wire(client); return; }
    if (++tries < 40) { setTimeout(boot, 50); return; }
    draw(synth());
  })();
})();
</script>
</body>
</html>
