<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Open pipeline KPI tiles</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:transparent;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#0f172a;-webkit-font-smoothing:antialiased}
  #root{box-sizing:border-box;width:100%;height:100%;padding:4px;min-width:0;overflow:auto}
  .grid{display:grid;gap:10px;height:100%}
  .grid.early{grid-template-columns:repeat(3,1fr)}
  .grid.src{grid-template-columns:repeat(2,1fr)}
  .grid.mix{grid-template-columns:repeat(4,1fr)}
  .grid.left{grid-template-columns:1fr}
  .card{border:1px solid #e2e8f0;border-radius:10px;background:#fff;padding:12px 14px;
    display:flex;flex-direction:column;justify-content:center;min-width:0;height:100%;box-sizing:border-box}
  .card.teal{background:#ecfdf5;border-color:#5eead4}
  .card.amber{background:#fffbeb;border-color:#fbbf24}
  .card.blue{background:#eff6ff;border-color:#93c5fd}
  .card.red{background:#fef2f2;border-color:#fecaca}
  .k{font-size:11px;font-weight:500;color:#64748b;letter-spacing:.02em;margin-bottom:4px}
  .v{font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
  .s{font-size:12px;color:#64748b;margin-top:4px}
  .wait{padding:20px;color:#64748b;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";
  var root = document.getElementById("root");
  var BLUE = "#2563eb", ORANGE = "#f97316", TEAL = "#0d9488", INK = "#0f172a";

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function money(v) {
    v = Number(v) || 0;
    if (v === 0) return "$0";
    var units = [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]], a = Math.abs(v);
    for (var i = 0; i < units.length; i++) {
      if (a >= units[i][0]) {
        var s = v / units[i][0];
        return "$" + (Math.abs(s) >= 100 ? String(Math.round(s)) : s.toPrecision(2)) + units[i][1];
      }
    }
    return "$" + (a >= 100 ? String(Math.round(v)) : Number(v.toPrecision(2)).toString());
  }
  function colKey(cfgVal) {
    if (cfgVal == null || cfgVal === "") return null;
    if (typeof cfgVal === "string" || typeof cfgVal === "number") return String(cfgVal);
    if (Object.prototype.toString.call(cfgVal) === "[object Array]") return colKey(cfgVal[0]);
    if (typeof cfgVal === "object") return String(cfgVal.columnId || cfgVal.id || "");
    return null;
  }
  function sourceId(src) {
    if (!src) return null;
    if (typeof src === "string") return src;
    if (typeof src === "object") return src.elementId || src.id || src.nodeId || null;
    return null;
  }
  function getClient() {
    return (window.SigmaPlugin && window.SigmaPlugin.client)
      || (window.sigma && window.sigma.plugin && window.sigma.plugin.client)
      || (window.sigmaComputing && window.sigmaComputing.plugin && window.sigmaComputing.plugin.client)
      || null;
  }

  function parseKpi(rows) {
    var o = { MKT: 0, SALES: 0, S0: 0, S0o: 0, S1: 0, S1o: 0, S2: 0, S2o: 0 };
    rows.forEach(function (r) {
      if (r.grain !== "KPI") return;
      if (r.dim === "MKT") o.MKT = r.val;
      else if (r.dim === "SALES") o.SALES = r.val;
      else if (r.dim === "S0") { o.S0 = r.val; o.S0o = r.opps || 0; }
      else if (r.dim === "S1") { o.S1 = r.val; o.S1o = r.opps || 0; }
      else if (r.dim === "S2") { o.S2 = r.val; o.S2o = r.opps || 0; }
    });
    var tot = o.MKT + o.SALES || 1;
    o.mMix = o.MKT / tot; o.sMix = o.SALES / tot;
    return o;
  }

  function card(label, valueHtml, sub, cls, color) {
    return '<div class="card ' + (cls || "") + '"><div class="k">' + esc(label) + '</div>' +
      '<div class="v" style="color:' + (color || INK) + '">' + valueHtml + '</div>' +
      (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
  }

  function render(mode, k) {
    if (!k) { root.innerHTML = '<div class="wait">Waiting for workbook data…</div>'; return; }
    var h = '';
    if (mode === "early") {
      h = '<div class="grid early">' +
        card("STAGE 0 OPEN", esc(money(k.S0)), esc(Math.round(k.S0o).toLocaleString() + " opportunities"), "blue", BLUE) +
        card("STAGE 1 OPEN", esc(money(k.S1)), esc(Math.round(k.S1o).toLocaleString() + " opportunities"), "blue", BLUE) +
        card("STAGE 2 OPEN", esc(money(k.S2)), esc(Math.round(k.S2o).toLocaleString() + " opportunities"), "teal", TEAL) +
        '</div>';
    } else if (mode === "src") {
      h = '<div class="grid src">' +
        card("MARKETING-SOURCED", esc(money(k.MKT)), "actual mix " + Math.round(k.mMix * 100) + "% · target 39%", "blue", BLUE) +
        card("SALES-SOURCED", esc(money(k.SALES)), "actual mix " + Math.round(k.sMix * 100) + "% · target 61%", "", ORANGE) +
        '</div>';
    } else if (mode === "left") {
      h = '<div class="grid left">' +
        card("Early stage open (S0+S1)", esc(money(k.S0 + k.S1)),
          "S0 " + Math.round(k.S0o).toLocaleString() + " · S1 " + Math.round(k.S1o).toLocaleString() + " opps",
          "red", "#dc2626") +
        '</div>';
    } else {
      h = '<div class="grid mix">' +
        card("MARKETING-SOURCED", esc(money(k.MKT)), "actual mix " + Math.round(k.mMix * 100) + "% · target 39%", "blue", BLUE) +
        card("SALES-SOURCED", esc(money(k.SALES)), "actual mix " + Math.round(k.sMix * 100) + "% · target 61%", "", ORANGE) +
        card("TOTAL STAGE 2+", esc(money(k.MKT + k.SALES)), "Marketing + Sales open ACV", "", INK) +
        card("MIX · ACTUAL vs TARGET",
          'M ' + Math.round(k.mMix * 100) + '% / S ' + Math.round(k.sMix * 100) + '%',
          "target M 39% / S 61%", "amber", INK) +
        '</div>';
    }
    root.innerHTML = h;
  }

  function synth() {
    return { MKT: 1e7, SALES: 2.2e7, S0: 3.1e7, S0o: 1199, S1: 5.4e6, S1o: 86, S2: 1.5e7, S2o: 522,
             mMix: 0.31, sMix: 0.69 };
  }

  var LAST = null, MODE = "mix", unsub = null;

  function wire(client) {
    client.config.configureEditorPanel([
      { name: "source", type: "element" },
      { name: "grain", type: "column", source: "source", allowedTypes: ["text"], label: "Grain" },
      { name: "dim", type: "column", source: "source", allowedTypes: ["text"], label: "Dimension" },
      { name: "series", type: "column", source: "source", allowedTypes: ["text"], label: "Series" },
      { name: "val", type: "column", source: "source", allowedTypes: ["number"], label: "Value" },
      { name: "opps", type: "column", source: "source", allowedTypes: ["number"], label: "Opps" },
      { name: "mode", type: "dropdown", values: ["early", "src", "mix", "left"], label: "Layout", defaultValue: "mix" }
    ]);
    client.config.subscribe(function (cfg) {
      if (unsub) { unsub(); unsub = null; }
      MODE = (cfg && cfg.mode) || "mix";
      if (!cfg || !sourceId(cfg.source) || !colKey(cfg.grain)) {
        LAST = synth(); render(MODE, LAST); return;
      }
      render(MODE, null);
      unsub = client.elements.subscribeToElementData(cfg.source, function (data) {
        var gk = colKey(cfg.grain), dk = colKey(cfg.dim), sk = colKey(cfg.series), vk = colKey(cfg.val);
        var ok = colKey(cfg.opps);
        var g = data && data[gk], d = data && data[dk], s = data && data[sk], v = data && data[vk];
        var o = ok && data ? data[ok] : null;
        if (!g || !d || !v || !g.length) { render(MODE, null); return; }
        var rows = [];
        for (var i = 0; i < g.length; i++) {
          rows.push({
            grain: String(g[i] || ""), dim: String(d[i] || ""),
            series: String(s && s[i] || ""), val: Number(v[i]) || 0,
            opps: o && o[i] != null ? Number(o[i]) : 0,
          });
        }
        LAST = parseKpi(rows); render(MODE, LAST);
      });
    });
  }

  var tries = 0;
  (function boot() {
    var client = getClient();
    if (client) { wire(client); return; }
    if (++tries < 40) { setTimeout(boot, 50); return; }
    LAST = synth(); render("mix", LAST);
  })();
  if (window.ResizeObserver) new ResizeObserver(function () { if (LAST) render(MODE, LAST); }).observe(root);
})();
</script>
</body>
</html>
